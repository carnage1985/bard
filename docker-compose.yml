services:
  bard:
    image: carnages/bard:latest
    container_name: bard
    restart: unless-stopped
    network_mode: host
    environment:
      BOT_TOKEN: "${BOT_TOKEN}"
      LOG_CHANNEL_ID: "${LOG_CHANNEL_ID:-}"
      WEB_BASE_URL: "${WEB_BASE_URL:-}"
      WEB_PORT: "${WEB_PORT:-3000}"
    volumes:
      - bard_data:/data
      - /hosting:/hosting:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  bard_data:
