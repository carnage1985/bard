# Secret-Hitler-Spielplan des Bard-Bots unter https://dagon.at/sh/<code>/
# Voraussetzung: Nginx läuft auf demselben Host wie der Bot (network_mode: host),
# Bot-Env: WEB_BASE_URL=https://dagon.at/sh  WEB_PORT=3000
#
# Variante A: Diesen location-Block in den bestehenden server { } von dagon.at einfügen.
# Variante B: Datei nach /etc/nginx/conf.d/ kopieren und das server-Beispiel unten anpassen.

# --- Variante A: nur der location-Block ---------------------------------------
#
# Es werden nur Pfade der Form /sh/<12 Hex-Zeichen>/... durchgereicht
# (Spiel-Code ist der Zugriffsschutz, alles andere bleibt dicht).
location ~ ^/sh/[a-f0-9]{12}(/.*)?$ {
    rewrite ^/sh/(.*)$ /$1 break;          # Präfix /sh entfernen
    proxy_pass http://127.0.0.1:3000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-Sent Events (Live-Updates): kein Puffern, lange Verbindungen
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

